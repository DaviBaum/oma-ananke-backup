[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oma-ananke"
version = "0.1.0"
description = "Local IFC optimization, physical routing and independent verification workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "numpy", "scipy", "ifcopenshell==0.8.5", "psutil", "typer", "httpx", "python-multipart", "huggingface-hub", "trimesh", "manifold3d", "cadquery-ocp", "cupy-cuda12x", "orjson", "ijson==3.4.0.post0"]

[project.scripts]
oma = "oma.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
